# Reference test cases: each runs one pipeline on a built-in synthetic scene
# (exact ground truth, deterministic noise) and checks metric thresholds.
# Thresholds sit ~10–15 % below the measured values, so a regression in a
# method or a pipeline config fails `heatmap testcases` (run in CI).
# FPS thresholds are deliberately low: CI machines vary.
cases:
  - id: TC-01
    description: p1 baseline detects both objects on a clean street
    pipeline: p1
    sequence: synthetic/street
    expect: {min_f1: 0.85, min_precision: 0.9, min_fps: 10}

  - id: TC-02
    description: p1 Gaussian filter keeps detection under Gaussian noise and restores PSNR
    pipeline: p1
    sequence: synthetic/street
    noise: "gaussian:10"
    seed: 42
    expect: {min_f1: 0.85, min_psnr: 28}

  - id: TC-03
    description: p2 finds dim objects in the night scene
    pipeline: p2
    sequence: synthetic/night
    expect: {min_f1: 0.40, min_fps: 10}

  - id: TC-04
    description: p3 gradient differencing finds the moving objects
    pipeline: p3
    sequence: synthetic/street
    expect: {min_f1: 0.60, min_recall: 0.9}

  - id: TC-05
    description: p3 median filter makes it robust to salt-and-pepper noise
    pipeline: p3
    sequence: synthetic/street
    noise: "salt_pepper:0.02"
    seed: 42
    expect: {min_f1: 0.60, min_psnr: 28}

  - id: TC-06
    description: p4 block LBP texture change on the street
    pipeline: p4
    sequence: synthetic/street
    expect: {min_f1: 0.70}

  - id: TC-07
    description: p4 on the shadow scene
    pipeline: p4
    sequence: synthetic/shadow
    expect: {min_f1: 0.55}

  - id: TC-08
    description: p5 FFT low-pass before frame differencing under Gaussian noise
    pipeline: p5
    sequence: synthetic/street
    noise: "gaussian:10"
    seed: 42
    expect: {min_f1: 0.45, min_psnr: 26}

  - id: TC-09
    description: p6 tracks corners of the moving objects
    pipeline: p6
    sequence: synthetic/street
    expect: {min_f1: 0.65, min_recall: 0.9}

  - id: TC-10
    description: p7 suppresses the hard shadow (p1 reaches only ~0.49 precision here)
    pipeline: p7
    sequence: synthetic/shadow
    expect: {min_f1: 0.90, min_precision: 0.90}

  - id: TC-11
    description: p7 under Gaussian noise
    pipeline: p7
    sequence: synthetic/street
    noise: "gaussian:10"
    seed: 42
    expect: {min_f1: 0.85}

  - id: TC-12
    description: p8 block statistics and area filter under salt-and-pepper noise
    pipeline: p8
    sequence: synthetic/street
    noise: "salt_pepper:0.02"
    seed: 42
    expect: {min_f1: 0.65}

  - id: TC-13
    description: p8 does not miss dim objects at night
    pipeline: p8
    sequence: synthetic/night
    expect: {min_recall: 0.95, min_fps: 10}
