version: "2"

linters:
  default: standard # errcheck, govet, ineffassign, staticcheck, unused
  enable:
    - revive       # style and mandatory comments on exported identifiers
    - gocritic
    - gocyclo
    - errorlint
    - unconvert
    - unparam
    - nakedret
    - misspell
  settings:
    gocyclo:
      min-complexity: 20
    revive:
      rules:
        - name: exported
        - name: package-comments
        - name: var-naming
        - name: indent-error-flow
        - name: error-strings
        - name: error-return
        - name: unused-parameter
  exclusions:
    presets:
      - std-error-handling
    rules:
      # Tests may have longer functions and repetition
      - path: _test\.go
        linters: [gocyclo, unparam]

formatters:
  enable:
    - gofmt
    - goimports
